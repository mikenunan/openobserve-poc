events {
    worker_connections 1024;
}

http {
    # Upstream definitions
    upstream partyman {
        server partyman:8081;
    }

    upstream documentcatalogue {
        server documentcatalogue:8082;
    }

    upstream documentfiling {
        server documentfiling:8083;
    }

    upstream frontend {
        server frontend:5173;
    }

    upstream otel-collector {
        server otel-collector:4318;
    }

    server {
        listen 8080;
        server_name localhost;

        # Frontend (default route)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # PartyMan API — strip /api/partyman prefix before forwarding
        location /api/partyman/ {
            rewrite ^/api/partyman/(.*) /$1 break;
            proxy_pass http://partyman;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # DocumentCatalogue API — strip /api/catalogue prefix before forwarding
        location /api/catalogue/ {
            rewrite ^/api/catalogue/(.*) /$1 break;
            proxy_pass http://documentcatalogue;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # DocumentFiling API — strip /api/filing prefix before forwarding
        location /api/filing/ {
            rewrite ^/api/filing/(.*) /$1 break;
            proxy_pass http://documentfiling;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # OTel Collector — proxy browser traces to OTLP/HTTP endpoint
        location /api/otel/ {
            rewrite ^/api/otel/(.*) /$1 break;
            proxy_pass http://otel-collector;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
